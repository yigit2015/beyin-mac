            <g stroke="#B79CFF" stroke-width="9" opacity=".45" filter="url(#b4)">
              <path d="M380 440 L440 410 L470 470 L420 530 L470 590"></path><path d="M440 410 L480 360"></path><path d="M420 530 L360 560"></path>
              <path d="M644 440 L584 410 L554 470 L604 530 L554 590"></path><path d="M584 410 L544 360"></path><path d="M604 530 L664 560"></path>
            </g>
            <g stroke="#EDE4FF" stroke-opacity=".75" stroke-width="2.5">
              <path d="M380 440 L440 410 L470 470 L420 530 L470 590"></path><path d="M440 410 L480 360"></path><path d="M420 530 L360 560"></path><path d="M470 470 L512 455"></path>
              <path d="M644 440 L584 410 L554 470 L604 530 L554 590"></path><path d="M584 410 L544 360"></path><path d="M604 530 L664 560"></path><path d="M554 470 L512 455"></path>
            </g>
          </g>
          <g fill="#FFFFFF">
            <circle cx="380" cy="440" r="5"></circle><circle cx="440" cy="410" r="6"></circle><circle cx="470" cy="470" r="5"></circle><circle cx="420" cy="530" r="6"></circle><circle cx="470" cy="590" r="4.5"></circle><circle cx="480" cy="360" r="4"></circle><circle cx="360" cy="560" r="4"></circle>
            <circle cx="644" cy="440" r="5"></circle><circle cx="584" cy="410" r="6"></circle><circle cx="554" cy="470" r="5"></circle><circle cx="604" cy="530" r="6"></circle><circle cx="554" cy="590" r="4.5"></circle><circle cx="544" cy="360" r="4"></circle><circle cx="664" cy="560" r="4"></circle>
          </g>
          <circle cx="512" cy="455" r="20" fill="#F2B84B" opacity=".6" filter="url(#b10)"></circle><circle cx="512" cy="455" r="9" fill="#F2B84B"></circle>
          <ellipse cx="512" cy="700" rx="200" ry="80" fill="url(#tealRim)"></ellipse>
          <ellipse cx="440" cy="390" rx="70" ry="40" transform="rotate(-25 440 390)" fill="#FFFFFF" opacity=".4" filter="url(#b10)"></ellipse>
          <path d="M512 335 C500 420 524 500 506 600 C500 640 510 668 512 682" fill="none" stroke="#1A0A45" stroke-opacity=".7" stroke-width="7"></path>
        </g>
        <path d="M512 330 C450 300 330 320 322 430 C290 470 300 560 345 600 C360 680 450 702 512 682 C574 702 664 680 679 600 C724 560 734 470 702 430 C694 320 574 300 512 330 Z" fill="none" stroke="#D6C4FF" stroke-opacity=".45" stroke-width="2"></path>
