      <!-- Ana simge -->
      <symbol id="icMain" viewBox="0 0 1024 1024">
        <use href="#icBg"></use><use href="#icNet"></use><use href="#icOrb"></use>
      </symbol>

      <!-- Küçük boyut (16–32 pt) için sadeleştirilmiş -->
      <symbol id="icSmall" viewBox="0 0 1024 1024">
        <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgG)"></rect>
        <g clip-path="url(#sq)"><rect x="100" y="100" width="824" height="824" fill="url(#bgV)"></rect></g>
        <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="url(#rimG)" stroke-width="6"></rect>
        <circle cx="512" cy="512" r="320" fill="none" stroke="#C8BCFF" stroke-opacity=".45" stroke-width="16"></circle>
        <use href="#icOrb" transform="translate(512 512) scale(1.3) translate(-512 -512)"></use>
        <circle cx="758" cy="320" r="70" fill="#F2B84B" opacity=".5" filter="url(#b18)"></circle>
        <circle cx="758" cy="320" r="46" fill="#F2B84B"></circle>
      </symbol>

      <!-- Alternatif A: sade -->
      <symbol id="icAltA" viewBox="0 0 1024 1024">
