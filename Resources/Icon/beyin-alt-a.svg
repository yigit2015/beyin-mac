            <ellipse cx="512" cy="512" rx="140" ry="96" transform="rotate(34 512 512)" stroke-opacity=".13" stroke-width="3"></ellipse>
            <ellipse cx="512" cy="512" rx="112" ry="40" transform="rotate(72 512 512)" stroke-opacity=".15" stroke-width="2.5"></ellipse>
