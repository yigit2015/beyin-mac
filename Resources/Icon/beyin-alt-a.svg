          <rect x="100" y="100" width="824" height="824" fill="url(#bgT)"></rect>
          <g fill="#FFFFFF">
            <circle cx="170" cy="190" r="2.2" opacity=".7"></circle><circle cx="248" cy="150" r="1.4" opacity=".5"></circle><circle cx="330" cy="214" r="1.8" opacity=".6"></circle><circle cx="420" cy="140" r="1.2" opacity=".45"></circle><circle cx="610" cy="160" r="2" opacity=".6"></circle><circle cx="705" cy="205" r="1.3" opacity=".5"></circle><circle cx="800" cy="150" r="2.4" opacity=".7"></circle><circle cx="870" cy="250" r="1.5" opacity=".5"></circle><circle cx="150" cy="320" r="1.3" opacity=".45"></circle><circle cx="880" cy="380" r="1.8" opacity=".55"></circle><circle cx="140" cy="470" r="2" opacity=".6"></circle><circle cx="900" cy="520" r="1.2" opacity=".4"></circle><circle cx="160" cy="640" r="1.6" opacity=".5"></circle><circle cx="885" cy="690" r="2.2" opacity=".6"></circle><circle cx="200" cy="780" r="1.3" opacity=".45"></circle><circle cx="300" cy="860" r="2" opacity=".55"></circle><circle cx="420" cy="890" r="1.2" opacity=".4"></circle><circle cx="600" cy="880" r="1.8" opacity=".5"></circle><circle cx="720" cy="850" r="1.4" opacity=".45"></circle><circle cx="830" cy="800" r="2" opacity=".6"></circle><circle cx="560" cy="120" r="1.1" opacity=".4"></circle><circle cx="250" cy="540" r="1.2" opacity=".35"></circle><circle cx="780" cy="560" r="1.1" opacity=".35"></circle><circle cx="360" cy="300" r="1" opacity=".35"></circle><circle cx="690" cy="300" r="1.1" opacity=".35"></circle><circle cx="380" cy="740" r="1.2" opacity=".35"></circle><circle cx="660" cy="760" r="1" opacity=".35"></circle><circle cx="470" cy="200" r="1.3" opacity=".4"></circle>
