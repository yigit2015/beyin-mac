<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
      <linearGradient id="bgG" x1="0.3" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#071214"></stop><stop offset=".45" stop-color="#0A1B21"></stop><stop offset="1" stop-color="#120E2A"></stop></linearGradient>
      <radialGradient id="bgV" cx="0.5" cy="0.48" r="0.5"><stop offset="0" stop-color="#7C5CF6" stop-opacity=".45"></stop><stop offset=".6" stop-color="#7C5CF6" stop-opacity=".10"></stop><stop offset="1" stop-color="#7C5CF6" stop-opacity="0"></stop></radialGradient>
      <radialGradient id="bgT" cx="0.86" cy="0.12" r="0.45"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".16"></stop><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"></stop></radialGradient>
      <linearGradient id="rimG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".6"></stop><stop offset=".35" stop-color="#FFFFFF" stop-opacity=".06"></stop><stop offset=".75" stop-color="#FFFFFF" stop-opacity=".04"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity=".24"></stop></linearGradient>
      <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".12"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient>
      <radialGradient id="orbG" cx="0.5" cy="0.5" r="0.5" fx="0.36" fy="0.30"><stop offset="0" stop-color="#F6F1FF"></stop><stop offset=".09" stop-color="#D4C2FF"></stop><stop offset=".28" stop-color="#A57BFF"></stop><stop offset=".52" stop-color="#6D3AE0"></stop><stop offset=".74" stop-color="#3B1690"></stop><stop offset="1" stop-color="#1A0A45"></stop></radialGradient>
      <radialGradient id="orbHalo" cx="0.5" cy="0.5" r="0.5"><stop offset=".55" stop-color="#8B5CF6" stop-opacity=".55"></stop><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"></stop></radialGradient>
      <radialGradient id="orbShade" cx="0.36" cy="0.30" r="0.75"><stop offset=".55" stop-color="#120434" stop-opacity="0"></stop><stop offset="1" stop-color="#120434" stop-opacity=".6"></stop></radialGradient>
      <radialGradient id="tealRim" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".6"></stop><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"></stop></radialGradient>
      <radialGradient id="fadeG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".6"></stop><stop offset="1" stop-color="#000000"></stop></radialGradient>
      <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F2B84B" stop-opacity="0"></stop><stop offset="1" stop-color="#F2B84B" stop-opacity=".9"></stop></linearGradient>
      <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"></rect></clipPath>
      <clipPath id="orbClip"><circle cx="512" cy="512" r="190"></circle></clipPath>
      <clipPath id="brainClip"><path d="M512 330 C450 300 330 320 322 430 C290 470 300 560 345 600 C360 680 450 702 512 682 C574 702 664 680 679 600 C724 560 734 470 702 430 C694 320 574 300 512 330 Z"></path></clipPath>
      <mask id="orbFade"><circle cx="512" cy="512" r="190" fill="url(#fadeG)"></circle></mask>
      <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity=".4"></feDropShadow></filter>
      <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix><feComponentTransfer><feFuncA type="linear" slope=".07"></feFuncA></feComponentTransfer></filter>
      <filter id="b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
      <filter id="b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter>
      <filter id="b18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter>

