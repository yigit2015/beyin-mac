          <rect x="100" y="100" width="824" height="824" filter="url(#grain)"></rect>
          <rect x="100" y="100" width="824" height="380" fill="url(#gloss)"></rect>
        </g>
        <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="url(#rimG)" stroke-width="3"></rect>
        <rect x="108" y="108" width="808" height="808" rx="178" fill="none" stroke="#FFFFFF" stroke-opacity=".05" stroke-width="2"></rect>
      </symbol>

      <!-- Katman 2: yörünge ve takımyıldız -->
      <symbol id="icNet" viewBox="0 0 1024 1024">
