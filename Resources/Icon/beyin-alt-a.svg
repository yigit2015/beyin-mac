          </g>
          <g stroke="#CDE4F0" stroke-opacity=".6" stroke-width="3.5">
            <path d="M268 371 Q326 236 473 233"></path><path d="M773 618 Q650 760 463 790"></path><path d="M463 790 Q302 771 251 618"></path><path d="M251 618 Q180 489 268 371"></path>
          </g>
          <g stroke="#F2B84B" stroke-width="12" filter="url(#b4)" opacity=".55">
            <path d="M473 233 Q637 203 734 338"></path><path d="M734 338 Q842 466 773 618"></path><path d="M734 338 Q820 300 862 292"></path>
          </g>
          <g stroke="#F2B84B" stroke-opacity=".95" stroke-width="4.5">
            <path d="M473 233 Q637 203 734 338"></path><path d="M734 338 Q842 466 773 618"></path><path d="M734 338 Q820 300 862 292"></path>
          </g>
        </g>
        <g>
          <circle cx="268" cy="371" r="30" fill="#2DD4BF" opacity=".5" filter="url(#b10)"></circle><circle cx="268" cy="371" r="13" fill="#2DD4BF"></circle><circle cx="268" cy="371" r="5" fill="#FFFFFF" opacity=".8"></circle>
          <circle cx="473" cy="233" r="26" fill="#E6EAF2" opacity=".45" filter="url(#b10)"></circle><circle cx="473" cy="233" r="11" fill="#E6EAF2"></circle>
          <circle cx="773" cy="618" r="32" fill="#B79CFF" opacity=".5" filter="url(#b10)"></circle><circle cx="773" cy="618" r="14" fill="#B79CFF"></circle><circle cx="773" cy="618" r="5" fill="#FFFFFF" opacity=".8"></circle>
          <circle cx="463" cy="790" r="28" fill="#2DD4BF" opacity=".5" filter="url(#b10)"></circle><circle cx="463" cy="790" r="12" fill="#2DD4BF"></circle>
          <circle cx="251" cy="618" r="24" fill="#E6EAF2" opacity=".4" filter="url(#b10)"></circle><circle cx="251" cy="618" r="10" fill="#E6EAF2"></circle>
          <circle cx="862" cy="292" r="20" fill="#E6EAF2" opacity=".4" filter="url(#b10)"></circle><circle cx="862" cy="292" r="8" fill="#E6EAF2"></circle>
          <circle cx="734" cy="338" r="58" fill="#F2B84B" opacity=".55" filter="url(#b18)"></circle>
