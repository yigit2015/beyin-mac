        <circle cx="512" cy="512" r="300" fill="none" stroke="#C8BCFF" stroke-opacity=".55" stroke-width="6" stroke-linecap="round" stroke-dasharray="0.1 22"></circle>
        <path d="M512 212 A300 300 0 0 1 742 319" fill="none" stroke="url(#trail)" stroke-width="7" stroke-linecap="round"></path>
        <use href="#icOrb" transform="translate(512 512) scale(1.12) translate(-512 -512)"></use>
        <circle cx="742" cy="319" r="62" fill="#F2B84B" opacity=".55" filter="url(#b18)"></circle>
        <circle cx="742" cy="319" r="26" fill="#F2B84B"></circle><circle cx="734" cy="311" r="9" fill="#FFF3D6" opacity=".9"></circle>
      </symbol>

      <!-- Alternatif B: beyin çağrışımı -->
      <symbol id="icAltB" viewBox="0 0 1024 1024">
        <use href="#icBg"></use>
        <circle cx="512" cy="512" r="300" fill="none" stroke="#C8BCFF" stroke-opacity=".4" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 18"></circle>
        <circle cx="512" cy="505" r="250" fill="url(#orbHalo)"></circle>
        <path d="M512 330 C450 300 330 320 322 430 C290 470 300 560 345 600 C360 680 450 702 512 682 C574 702 664 680 679 600 C724 560 734 470 702 430 C694 320 574 300 512 330 Z" fill="url(#orbG)"></path>
        <g clip-path="url(#brainClip)">
